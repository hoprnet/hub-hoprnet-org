---
name: Build Node Admin Docker

on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        required: true
        default: main
      tag:
        type: string
        required: true
        default: latest

permissions: {}

concurrency:
  group: hopr-admin
  cancel-in-progress: true

jobs:

  build:
    name: docker
    runs-on: ubuntu-latest-4-cores
    permissions:
      contents: read
    steps:
      - name: Checkout hoprnet repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.inputs.branch }}"

      - name: Set up Google Cloud Credentials
        id: auth
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1
        with:
          token_format: "access_token"
          credentials_json: ${{ secrets.GOOGLE_HOPRASSOCIATION_CREDENTIALS_REGISTRY }}

      - name: Login Google Container Registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          push: true
          file: scripts/NodeAdmin.Dockerfile
          tags: europe-west3-docker.pkg.dev/${{ secrets.GOOGLE_HOPRASSOCIATION_PROJECT }}/docker-images/hopr-admin:${{ github.event.inputs.tag }}
  